name: Upstream Android build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upstream-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out BeyondConsole
        uses: actions/checkout@v4

      - name: Check out chiaki-ng
        uses: actions/checkout@v4
        with:
          repository: chiaki-ng/chiaki-ng
          ref: 43728af2e639fecb8a7af1cd68c29820a40de973
          path: upstream/chiaki-ng
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Configure upstream Android build
        working-directory: upstream/chiaki-ng/android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("app/build.gradle")
          source = gradle_file.read_text()
          anchor = '"-DCHIAKI_ENABLE_TESTS=OFF",'
          replacement = anchor + '\n                        "-DCURL_USE_LIBPSL=OFF",'
          if anchor not in source:
              raise SystemExit("Could not find the upstream CMake arguments block")
          if "-DCURL_USE_LIBPSL=OFF" not in source:
              gradle_file.write_text(source.replace(anchor, replacement, 1))
          PY

      - name: Build upstream Android client
        working-directory: upstream/chiaki-ng/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload upstream APK
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-android-reference
          path: upstream/chiaki-ng/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
